name: Grade Wireless Security Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas --quiet

      # This workflow must NEVER run wireless_audit.py in the repo root: it would
      # overwrite the student's committed audit_results.csv and destroy the graded
      # artefact. Regeneration happens only in a throwaway temp copy below.

      - name: Check submission file
        id: submission
        run: |
          python3 << 'PY'
          import os
          import sys
          import pandas as pd

          try:
              df = pd.read_csv("audit_results.csv", encoding="utf-8-sig")
          except FileNotFoundError:
              # Not a failure: a fresh repo or the template has nothing to grade yet.
              print("::notice::audit_results.csv is not committed yet. Run the audit script, fill in analyst_notes, and commit the file.")
              if os.environ.get("GITHUB_OUTPUT"):
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                      fh.write("present=false\n")
              sys.exit(0)
          except Exception as e:
              print(f"::error::audit_results.csv could not be read as CSV: {e}")
              sys.exit(1)

          required_cols = [
              "check_id", "check_name", "bssid", "ssid", "encryption",
              "channel", "signal_dbm", "vendor_oui", "vendor_name",
              "is_hidden", "client_count", "notes", "default_severity", "analyst_notes"
          ]
          missing = [c for c in required_cols if c not in df.columns]
          if missing:
              print(f"::error::Missing required columns: {missing}")
              sys.exit(1)

          if os.environ.get("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("present=true\n")

          print(f"OK - all {len(required_cols)} required columns present")
          print(f"OK - {len(df)} finding rows")

          # Empty CSV cells read back as NaN, so notna() is the wrong predicate.
          notes = df["analyst_notes"].fillna("").astype(str).str.strip()
          filled = int((notes != "").sum())
          if filled == 0:
              print("::error::No analyst_notes filled in. Classify every finding and commit again.")
              sys.exit(1)
          if filled < len(df):
              print(f"::warning::{len(df) - filled} of {len(df)} rows still have empty analyst_notes")
          print(f"OK - {filled}/{len(df)} findings have analyst_notes")

          severity_keywords = ["Critical", "High", "Medium", "Low", "Accepted Risk"]
          classified = sum(1 for n in notes if any(k in n for k in severity_keywords))
          if classified < 3:
              print(f"::warning::Only {classified} findings carry an explicit severity classification")

          remediation_keywords = ["remediation", "fix", "rotate", "deploy", "segment",
                                  "block", "patch", "upgrade", "migrate", "replace",
                                  "disable", "isolate"]
          remediated = sum(1 for n in notes if any(k in n.lower() for k in remediation_keywords))
          if remediated < 3:
              print(f"::warning::Only {remediated} findings appear to include a remediation proposal")

          fp_keywords = ["false positive", "false-positive", "not a finding", "not a risk",
                         "authorized", "expected", "legitimate", "accepted risk"]
          if not any(k in n.lower() for n in notes for k in fp_keywords):
              print("::warning::No false positive or accepted-risk call identified in analyst_notes")

          print("OK - structure validation passed")
          PY

      - name: Compare findings against the dataset (advisory)
        if: steps.submission.outputs.present == 'true'
        run: |
          python3 << 'PY'
          import os, shutil, subprocess, sys, tempfile
          import pandas as pd

          submitted = pd.read_csv("audit_results.csv", encoding="utf-8-sig")
          submitted_pairs = set(zip(submitted["check_id"], submitted["bssid"].astype(str)))

          workdir = tempfile.mkdtemp()
          for name in ("wireless_audit.py", "wireless_networks.csv"):
              shutil.copy(name, workdir)
          proc = subprocess.run([sys.executable, "wireless_audit.py"],
                                cwd=workdir, capture_output=True, text=True)
          print(proc.stdout)

          regen_path = os.path.join(workdir, "audit_results.csv")
          if not os.path.exists(regen_path):
              print("::warning::Could not regenerate expected findings; skipping comparison.")
              sys.exit(0)

          expected = pd.read_csv(regen_path)
          expected_pairs = set(zip(expected["check_id"], expected["bssid"].astype(str)))

          missing = expected_pairs - submitted_pairs
          extra = submitted_pairs - expected_pairs
          if missing:
              print(f"::warning::{len(missing)} expected (check_id, bssid) pairs missing from your CSV, "
                    f"e.g. {sorted(missing)[:3]}. Re-run the script on the current dataset.")
          if extra:
              print(f"::warning::{len(extra)} (check_id, bssid) pairs in your CSV are not produced by the current script, "
                    f"e.g. {sorted(extra)[:3]}. Rows may have been hand-edited.")
          if not missing and not extra:
              print("OK - findings reconcile with a fresh run of the audit script")
          PY

      - name: Summary
        if: steps.submission.outputs.present == 'true'
        run: |
          python3 << 'PY'
          import os
          import pandas as pd

          df = pd.read_csv("audit_results.csv", encoding="utf-8-sig")
          notes = df["analyst_notes"].fillna("").astype(str).str.strip()
          filled = int((notes != "").sum())

          lines = ["### Grading Summary", ""]
          lines.append(f"- **Total findings:** {len(df)}")
          lines.append(f"- **Findings with analyst notes:** {filled}/{len(df)}")
          lines.append(f"- **Unique checks triggered:** {df['check_id'].nunique()}")
          lines.append("")
          lines.append("| Severity | Count |")
          lines.append("|----------|-------|")
          for sev in ["Critical", "High", "Medium", "Low"]:
              lines.append(f"| {sev} | {len(df[df['default_severity'] == sev])} |")
          body = "\n".join(lines) + "\n"
          print(body)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(body)
          PY

      - name: Upload results artifact
        if: steps.submission.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit_results.csv
          retention-days: 30
